# Offline / air-gapped variant of compose.yaml.
#
# Uses the pre-built images exported by export-docker-images.bat and loaded by
# import-docker-images.bat, so nothing is built or pulled from the internet.
# Keep the service settings below in sync with compose.yaml.
#
# Image tag defaults to "latest"; override with IMAGE_TAG (e.g. IMAGE_TAG=1.0.1)
# to match the tag you passed to export-docker-images.bat.

services:

  # (i) Redis In-Memory Message Bus
  redisserver:
    image: redis:7-alpine
    pull_policy: never
    command: redis-server --bind 0.0.0.0 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # (ii) UDP Parser Ingestion Service
  udpparser:
    image: biopat-spectrouv/udpparser:${IMAGE_TAG:-latest}
    pull_policy: never
    environment:
      UDP_IP: "${UDP_IP:-0.0.0.0}"
      UDP_PORT: "${UDP_PORT:-20202}"
      UDP_CHANNEL_NAME: "${UDP_CHANNEL_NAME:-channel_1}"
      REDIS_IP_ADDRESS: "${REDIS_IP_ADDRESS:-redisserver}"
      REDIS_PORT_NUMBER: "${REDIS_PORT_NUMBER:-6379}"
    ports:
      - "${UDP_PORT:-20202}:${UDP_PORT:-20202}/udp"
    depends_on:
      - redisserver
    restart: always

  # (iii) OPC UA Server Service
  opcserver:
    image: biopat-spectrouv/opcserver:${IMAGE_TAG:-latest}
    pull_policy: never
    environment:
      OPC_IP_ADDRESS: "${OPC_IP_ADDRESS:-0.0.0.0}"
      OPC_PORT_NUMBER: "${OPC_PORT_NUMBER:-4841}"
      REDIS_IP_ADDRESS: "${REDIS_IP_ADDRESS:-redisserver}"
      REDIS_PORT_NUMBER: "${REDIS_PORT_NUMBER:-6379}"
    ports:
      - "${OPC_PORT_NUMBER:-4841}:${OPC_PORT_NUMBER:-4841}"
    depends_on:
      - redisserver
    restart: always

  # (iv) Watchdog / Helper Service
  udphelper:
    image: biopat-spectrouv/udphelper:${IMAGE_TAG:-latest}
    pull_policy: never
    environment:
      REDIS_IP_ADDRESS: "${REDIS_IP_ADDRESS:-redisserver}"
      REDIS_PORT_NUMBER: "${REDIS_PORT_NUMBER:-6379}"
    depends_on:
      - redisserver
    restart: always

volumes:
  redis_data:
