  mptudpclient: 
    image: mptudpclient

    expose: 
      - "10.20.20.11:6379"
      - "192.168.0.180:20202/udp"

    ports: 
      - "192.168.0.180:20202:20202/udp"
    environment: 
      UDP_IP: "0.0.0.0"
      UDP_PORT: "20202"
      UDP_CHANNEL_NAME: "channel_1"
      REDIS_IP: "10.20.20.11"

  opcserver: 
    image: opcserver 

    ports: 
      - "4841:4841"

    environment: 
      OPC_IP_ADDRESS: "0.0.0.0" 
      OPC_PORT_NUMBER: 4841
      REDIS_IP_ADDRESS: redisserver
      REDIS_PORT_NUMBER: 6379

    depends_on:
      - redisserver
   
    restart: always

  redisserver: 
    image: redis
    
    command: redis-server --bind 0.0.0.0 --appendonly yes

    ports: 
      - "6379:6379"
    
    volumes: 
      - ./redis_data:/redis_data
    
    restart: always

volumes:
  redis_data:
