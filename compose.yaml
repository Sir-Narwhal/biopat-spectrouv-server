services:

  # (i) Redis In-Memory Message Bus
  redisserver:
    image: redis:7-alpine
    command: redis-server --bind 0.0.0.0 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # (ii) UDP Parser Ingestion Service
  udpparser:
    build:
      context: ./app
      target: udpparser
    environment:
      UDP_IP: "${UDP_IP:-0.0.0.0}"
      UDP_PORT: "${UDP_PORT:-20202}"
      UDP_CHANNEL_NAME: "${UDP_CHANNEL_NAME:-channel_1}"
      REDIS_IP_ADDRESS: "${REDIS_IP_ADDRESS:-redisserver}"
      REDIS_PORT_NUMBER: "${REDIS_PORT_NUMBER:-6379}"
    ports:
      - "${UDP_PORT:-20202}:${UDP_PORT:-20202}/udp"
    depends_on:
      - redisserver
    restart: always

  # (iii) OPC UA Server Service
  opcserver:
    build:
      context: ./app
      target: opcserver
    environment:
      OPC_IP_ADDRESS: "${OPC_IP_ADDRESS:-0.0.0.0}"
      OPC_PORT_NUMBER: "${OPC_PORT_NUMBER:-4841}"
      REDIS_IP_ADDRESS: "${REDIS_IP_ADDRESS:-redisserver}"
      REDIS_PORT_NUMBER: "${REDIS_PORT_NUMBER:-6379}"
    ports:
      - "${OPC_PORT_NUMBER:-4841}:${OPC_PORT_NUMBER:-4841}"
    depends_on:
      - redisserver
    restart: always

  # (iv) Watchdog / Helper Service
  udphelper:
    build:
      context: ./app
      target: udphelper
    environment:
      REDIS_IP_ADDRESS: "${REDIS_IP_ADDRESS:-redisserver}"
      REDIS_PORT_NUMBER: "${REDIS_PORT_NUMBER:-6379}"
    depends_on:
      - redisserver
    restart: always

volumes:
  redis_data:
