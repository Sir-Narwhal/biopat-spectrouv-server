<svg viewBox="0 0 1200 1020" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- page background so text stays legible on both light and dark hosting pages -->
  <rect x="0" y="0" width="1200" height="1020" fill="#fbfbfd"/>

  <!-- ============ Spectrometer hardware : the only thing that is NOT on the host PC ============ -->
  <rect x="345" y="20" width="480" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="585" y="52" text-anchor="middle" font-size="17" font-weight="600" fill="#78350f">Sartorius BioPAT® Spectro UV / tec5 Spectrometer</text>
  <text x="585" y="74" text-anchor="middle" font-size="13" fill="#92400e">UV-Vis optical measurement hardware</text>

  <line x1="585" y1="100" x2="585" y2="152" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="130" font-size="11.5" font-style="italic" fill="#6b7280">vendor hardware interface (not UDP)</text>

  <!-- ============ Spectrometer Host PC : tecSaaS MPT + Docker stack + tray app ALL run here ============ -->
  <rect x="60" y="145" width="1030" height="545" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="76" y="157" width="250" height="26" rx="13" fill="#334155"/>
  <text x="201" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.4">HOST PC &#183; WINDOWS</text>

  <!-- tecSaaS MPT : vendor software, third-party, NOT part of this repo. Same amber family as the
       spectrometer hardware above, to show "vendor-provided" vs. "this repo's own components". -->
  <rect x="345" y="155" width="480" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="815" y="170" text-anchor="end" font-size="9.5" fill="#c99a4a">third-party</text>
  <text x="585" y="187" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">tecSaaS MPT</text>
  <text x="585" y="207" text-anchor="middle" font-size="12.5" fill="#92400e">Vendor control software &#183; drives the spectrometer &#183; broadcasts UDP</text>

  <!-- tecSaaS -> udpparser : the ACTUAL UDP hop. One 840B datagram per data type, per cycle. -->
  <path d="M 585,235 L 585,258 L 225,258 L 225,296" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="250" font-size="12" fill="#374151">5&#215; UDP datagrams / cycle &#8594; :20202</text>
  <text x="235" y="268" text-anchor="start" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="10.5" fill="#6b7280">840B each: sample &#183; ref &#183; trans &#183; absorb &#183; calib</text>

  <!-- Row 1: udpparser / redisserver / udphelper, Docker Compose containers, one consistent style -->
  <rect x="110" y="300" width="230" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="330" y="315" text-anchor="end" font-size="9.5" fill="#93a5c9">docker</text>
  <text x="225" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">(ii) udpparser</text>
  <line x1="150" y1="342" x2="300" y2="342" stroke="#bfdbfe" stroke-width="1"/>
  <text x="225" y="362" text-anchor="middle" font-size="12.5" fill="#1e40af">Binds :20202/udp</text>
  <text x="225" y="382" text-anchor="middle" font-size="12.5" fill="#1e40af">Unpacks 201 pts/packet</text>
  <text x="225" y="402" text-anchor="middle" font-size="12.5" fill="#1e40af">Writes to Redis (ex=5s)</text>

  <rect x="470" y="300" width="230" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="690" y="315" text-anchor="end" font-size="9.5" fill="#93a5c9">docker</text>
  <text x="585" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">(i) redisserver</text>
  <line x1="510" y1="342" x2="660" y2="342" stroke="#bfdbfe" stroke-width="1"/>
  <text x="585" y="362" text-anchor="middle" font-size="12.5" fill="#1e40af">Redis 7 Alpine</text>
  <text x="585" y="382" text-anchor="middle" font-size="12.5" fill="#1e40af">Port :6379</text>
  <text x="585" y="402" text-anchor="middle" font-size="12.5" fill="#1e40af">In-memory state bus</text>

  <rect x="830" y="300" width="230" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1050" y="315" text-anchor="end" font-size="9.5" fill="#93a5c9">docker</text>
  <text x="945" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">(iv) udphelper</text>
  <line x1="870" y1="342" x2="1020" y2="342" stroke="#bfdbfe" stroke-width="1"/>
  <text x="945" y="362" text-anchor="middle" font-size="12.5" fill="#1e40af">Watchdog</text>
  <text x="945" y="382" text-anchor="middle" font-size="12.5" fill="#1e40af">Checks absorbance freshness</text>
  <text x="945" y="402" text-anchor="middle" font-size="12.5" fill="#1e40af">Sets mpt_refresh</text>

  <!-- Row 2, col 2: opcserver, also a Docker Compose container -->
  <rect x="470" y="530" width="230" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="690" y="545" text-anchor="end" font-size="9.5" fill="#93a5c9">docker</text>
  <text x="585" y="562" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">(iii) opcserver</text>
  <line x1="510" y1="572" x2="660" y2="572" stroke="#bfdbfe" stroke-width="1"/>
  <text x="585" y="592" text-anchor="middle" font-size="12.5" fill="#1e40af">Port :4841</text>
  <text x="585" y="612" text-anchor="middle" font-size="12.5" fill="#1e40af">201-pt float arrays</text>
  <text x="585" y="632" text-anchor="middle" font-size="12.5" fill="#1e40af">1 write per channel / sec</text>

  <!-- Row 2, col 3: Windows Tray App, native Windows .exe on this SAME host, not a container -->
  <rect x="830" y="530" width="230" height="130" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <text x="1050" y="545" text-anchor="end" font-size="9.5" fill="#c4b5fd">native .exe</text>
  <text x="945" y="562" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Windows Tray App</text>
  <line x1="870" y1="572" x2="1020" y2="572" stroke="#ddd6fe" stroke-width="1"/>
  <text x="945" y="592" text-anchor="middle" font-size="12.5" fill="#5b21b6">MPT Guardian (tray_app/)</text>
  <text x="945" y="612" text-anchor="middle" font-size="12.5" fill="#5b21b6">Controls tecSaaS MPT (UI automation)</text>
  <text x="945" y="632" text-anchor="middle" font-size="12.5" fill="#5b21b6">Mandatory for sessions &gt; 6h</text>

  <!-- udpparser -> redisserver : label centered midway between the two boxes -->
  <line x1="344" y1="365" x2="466" y2="365" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="349" text-anchor="middle" font-size="12" fill="#374151">JSON arrays</text>
  <text x="405" y="383" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="10.5" fill="#6b7280">SET key EX 5</text>

  <!-- redisserver <-> udphelper : label centered midway between the two boxes -->
  <line x1="704" y1="365" x2="826" y2="365" stroke="#374151" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="765" y="349" text-anchor="middle" font-size="12" fill="#374151">GET / SET</text>
  <text x="765" y="383" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="10.5" fill="#6b7280">absorbance_channel_1</text>

  <!-- redisserver -> opcserver : the actual Redis -> OPC UA conversion step.
       Label kept to the LEFT of the line, in otherwise-empty space, so nothing else can cross it. -->
  <line x1="585" y1="434" x2="585" y2="526" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="473" text-anchor="end" font-size="12" fill="#374151">1 Hz poll</text>
  <text x="570" y="491" text-anchor="end" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="10.5" fill="#6b7280">json.loads() &#8594; write_value()</text>

  <!-- redisserver -> Windows Tray App : DIRECT connection to Redis (not routed through udphelper).
       Exits redisserver low enough to clear the "GET / SET" label, and its own labels sit with
       generous clearance above row 2 so nothing touches the Tray App box below. -->
  <path d="M 700,418 L 745,418 L 745,595 L 826,595" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-dashed)"/>
  <text x="756" y="465" font-size="12" fill="#4b5563">Redis signal keys</text>
  <text x="756" y="483" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="10.5" fill="#6b7280">mpt_refresh &#183; mpt_start &#183; mpt_stop</text>

  <!-- opcserver -> SCADA : the OPC UA publication step, leaving the host for the plant network.
       Labels sit right below opcserver, well clear of the SCADA box further down. -->
  <line x1="585" y1="664" x2="585" y2="756" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="678" font-size="12" fill="#374151">OPC UA write</text>
  <text x="600" y="722" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="10.5" fill="#6b7280">ns=1;s=absorbance_channel_1</text>

  <!-- ============ The only genuinely remote system ============ -->
  <rect x="400" y="760" width="370" height="100" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#soft-shadow)"/>
  <text x="585" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">SCADA / Bioreactor Controllers</text>
  <text x="585" y="814" text-anchor="middle" font-size="12.5" fill="#374151">opc.tcp://&lt;host&gt;:4841</text>
  <text x="585" y="834" text-anchor="middle" font-size="11.5" fill="#6b7280">Ignition, DeltaV, PCS 7, FactoryTalk, OSIsoft PI</text>
  <text x="585" y="850" text-anchor="middle" font-size="11" fill="#9ca3af">reads Float64[201] OPC UA nodes &#183; remote network</text>

  <!-- ============ Legend ============ -->
  <line x1="60" y1="885" x2="1090" y2="885" stroke="#e5e7eb" stroke-width="1"/>

  <rect x="70" y="900" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="94" y="912" font-size="12" fill="#374151">Vendor hardware / software (third-party)</text>

  <rect x="380" y="900" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="404" y="912" font-size="12" fill="#374151">Docker Compose service (this repo)</text>

  <rect x="650" y="900" width="16" height="16" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="674" y="912" font-size="12" fill="#374151">Native Windows app (this repo)</text>

  <rect x="900" y="900" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="924" y="912" font-size="12" fill="#374151">Remote system</text>

  <line x1="70" y1="936" x2="110" y2="936" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="940" font-size="12" fill="#374151">Direct data flow</text>

  <line x1="280" y1="936" x2="320" y2="936" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-dashed)"/>
  <text x="330" y="940" font-size="12" fill="#374151">Indirect signal, via Redis (polled)</text>

  <text x="600" y="940" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="10.5" fill="#6b7280">monospace</text>
  <text x="680" y="940" font-size="12" fill="#374151">= wire format / command at that hop</text>
</svg>
